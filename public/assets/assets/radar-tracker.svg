<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <!-- Background -->
    <linearGradient id="radarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e43" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ff2e43" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ff2e43" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes sweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes blipPulse {
        0% { transform: scale(0.6); opacity: 1; }
        50% { transform: scale(2.4); opacity: 0; }
        100% { transform: scale(0.6); opacity: 0; }
      }
      @keyframes ping {
        0%, 100% { fill: #ff2e43; filter: drop-shadow(0 0 8px #ff2e43); }
        50% { fill: #ffffff; filter: drop-shadow(0 0 16px #ffffff); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      .sweep-arm { transform-origin: 220px 160px; animation: sweep 5s linear infinite; }
      .pulse-ring-1 { transform-origin: 220px 160px; animation: blipPulse 2.4s ease-out infinite; }
      .pulse-ring-2 { transform-origin: 220px 160px; animation: blipPulse 2.4s ease-out 1.2s infinite; }
      .target-ping { animation: ping 1.8s ease-in-out infinite; }
      .dashed-ring { stroke-dasharray: 6 6; animation: dashAnim 8s linear infinite; }
      .term-font { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; fill: #8b949e; }
      .term-hi { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #ff4d5e; font-weight: bold; }
      .term-green { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #3fb950; font-weight: bold; }
    </style>
  </defs>

  <!-- Frame Base -->
  <rect width="880" height="320" rx="10" fill="url(#radarBg)" stroke="rgba(255, 46, 67, 0.25)" stroke-width="1.5" />

  <!-- Left Side: Interactive Radar Screen (Center: 220, 160) -->
  <g id="radar">
    <!-- Concentric Distance Rings -->
    <circle cx="220" cy="160" r="130" fill="rgba(255, 46, 67, 0.02)" stroke="rgba(255, 46, 67, 0.2)" stroke-width="1" />
    <circle cx="220" cy="160" r="95" fill="none" stroke="rgba(255, 46, 67, 0.25)" stroke-width="1" />
    <circle cx="220" cy="160" r="60" fill="none" stroke="rgba(255, 46, 67, 0.3)" stroke-width="1" />
    <circle cx="220" cy="160" r="25" fill="none" stroke="rgba(255, 46, 67, 0.35)" stroke-width="1" />

    <!-- Dashed Tactical Perimeter -->
    <circle class="dashed-ring" cx="220" cy="160" r="115" fill="none" stroke="rgba(255, 46, 67, 0.4)" stroke-width="1.2" />

    <!-- Crosshairs -->
    <line x1="60" y1="160" x2="380" y2="160" stroke="rgba(255, 46, 67, 0.25)" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="220" y1="20" x2="220" y2="300" stroke="rgba(255, 46, 67, 0.25)" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Rotating Sweep Beam -->
    <g class="sweep-arm">
      <path d="M 220 160 L 220 30 A 130 130 0 0 1 340 110 Z" fill="url(#sweepGrad)" />
      <line x1="220" y1="160" x2="220" y2="30" stroke="#ff4d5e" stroke-width="2" />
    </g>

    <!-- Target Blip at Dadar West (offset from center) -->
    <g transform="translate(260, 120)">
      <circle class="pulse-ring-1" cx="0" cy="0" r="28" fill="none" stroke="#ff2e43" stroke-width="2" />
      <circle class="pulse-ring-2" cx="0" cy="0" r="28" fill="none" stroke="#ff2e43" stroke-width="1.5" />
      <circle class="target-ping" cx="0" cy="0" r="6" fill="#ff2e43" />
      <!-- Target Marker Reticle -->
      <path d="M -12 -12 L -6 -12 M -12 -12 L -12 -6" stroke="#ff2e43" stroke-width="1.5" fill="none" />
      <path d="M 12 -12 L 6 -12 M 12 -12 L 12 -6" stroke="#ff2e43" stroke-width="1.5" fill="none" />
      <path d="M -12 12 L -6 12 M -12 12 L -12 6" stroke="#ff2e43" stroke-width="1.5" fill="none" />
      <path d="M 12 12 L 6 12 M 12 12 L 12 6" stroke="#ff2e43" stroke-width="1.5" fill="none" />
      <text x="16" y="4" class="term-hi" font-size="10">TARGET LOCKED</text>
      <text x="16" y="16" class="term-font" font-size="9">APT 302 (3RD FL)</text>
    </g>

    <!-- Radar Coordinates HUD -->
    <text x="75" y="40" class="term-font" font-size="9">RANGE: 2.5 KM</text>
    <text x="75" y="295" class="term-font" font-size="9">AZIMUTH: 042° TRUE</text>
    <text x="360" y="295" text-anchor="end" class="term-font" font-size="9">SATELLITE: LEVEL-19</text>
  </g>

  <!-- Divider Line -->
  <line x1="420" y1="20" x2="420" y2="300" stroke="rgba(255, 46, 67, 0.2)" stroke-width="1" />

  <!-- Right Side: Tactical Target Telemetry -->
  <g transform="translate(450, 30)">
    <text x="0" y="15" font-family="'Inter', sans-serif" font-weight="900" font-size="15" fill="#ffffff" letter-spacing="1.5">
      TACTICAL RADAR TELEMETRY // DISPATCH HUD
    </text>
    <text x="0" y="32" class="term-font" font-size="10">INCIDENT ID: <tspan class="term-hi">CASE-2026-0002</tspan> · MUMBAI CONTROL ROOM</text>

    <!-- Telemetry Data Cards -->
    <g transform="translate(0, 50)">
      <!-- Box 1 -->
      <rect width="190" height="48" rx="6" fill="rgba(255, 46, 67, 0.05)" stroke="rgba(255, 46, 67, 0.2)" />
      <text x="12" y="18" class="term-font" font-size="9">TACTICAL POSITION</text>
      <text x="12" y="36" class="term-hi" font-size="11">19.0192° N, 72.8428° E</text>

      <!-- Box 2 -->
      <rect x="205" width="190" height="48" rx="6" fill="rgba(255, 46, 67, 0.05)" stroke="rgba(255, 46, 67, 0.2)" />
      <text x="217" y="18" class="term-font" font-size="9">STRUCTURAL ELEVATION</text>
      <text x="217" y="36" class="term-hi" font-size="11">FLOOR 3 · APT 302</text>
    </g>

    <g transform="translate(0, 110)">
      <!-- Box 3 -->
      <rect width="190" height="48" rx="6" fill="rgba(255, 46, 67, 0.05)" stroke="rgba(255, 46, 67, 0.2)" />
      <text x="12" y="18" class="term-font" font-size="9">GEOCODER PRECISION</text>
      <text x="12" y="36" class="term-green" font-size="11">ACCURACY: ±350M</text>

      <!-- Box 4 -->
      <rect x="205" width="190" height="48" rx="6" fill="rgba(255, 46, 67, 0.05)" stroke="rgba(255, 46, 67, 0.2)" />
      <text x="217" y="18" class="term-font" font-size="9">DISPATCH ETA</text>
      <text x="217" y="36" class="term-hi" font-size="11">3 MINS (PATROL UNIT 4)</text>
    </g>

    <g transform="translate(0, 175)">
      <rect width="395" height="75" rx="6" fill="rgba(10, 10, 15, 0.8)" stroke="rgba(255, 46, 67, 0.3)" />
      <text x="12" y="20" class="term-font" font-size="9" fill="#ff7584">COVERT INTENT IDENTIFIER:</text>
      <text x="12" y="38" class="term-hi" font-size="11">DISGUISED PIZZA CALL PROTOCOL</text>
      <text x="12" y="54" class="term-font" font-size="10">Dispatcher initiated closed Yes/No protocol to protect caller.</text>
      <text x="12" y="68" class="term-green" font-size="9">● VERIFIED THREAT: HOSTILE PERSON IN IMMEDIATE PROXIMITY</text>
    </g>
  </g>
</svg>

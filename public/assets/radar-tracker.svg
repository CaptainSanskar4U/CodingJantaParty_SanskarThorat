<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111319" />
      <stop offset="100%" stop-color="#090a0e" />
    </linearGradient>

    <!-- Radar CRT Screen Gradient -->
    <radialGradient id="crtGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1815" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#09100e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#060908" stop-opacity="1" />
    </radialGradient>

    <!-- Phosphor Radar Sweep Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30d158" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#30d158" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#30d158" stop-opacity="0" />
    </linearGradient>

    <!-- Radar Grid Pattern -->
    <pattern id="radarGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16221c" stroke-width="0.5" />
    </pattern>

    <style>
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes targetPulse {
        0% { transform: scale(0.8); opacity: 0.9; }
        50% { transform: scale(2.2); opacity: 0; }
        100% { transform: scale(0.8); opacity: 0; }
      }
      @keyframes reticleBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes signalBarAnim1 {
        0%, 100% { height: 18px; }
        50% { height: 32px; }
      }
      @keyframes signalBarAnim2 {
        0%, 100% { height: 26px; }
        50% { height: 12px; }
      }
      @keyframes signalBarAnim3 {
        0%, 100% { height: 38px; }
        50% { height: 24px; }
      }

      .sweep-arm { transform-origin: 210px 170px; animation: radarSweep 6s linear infinite; }
      .target-ping { transform-origin: 275px 125px; animation: targetPulse 2.4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite; }
      .reticle-lock { animation: reticleBlink 2s ease-in-out infinite; }
      .bar-1 { animation: signalBarAnim1 1.2s ease-in-out infinite; }
      .bar-2 { animation: signalBarAnim2 1.6s ease-in-out infinite; }
      .bar-3 { animation: signalBarAnim3 1.4s ease-in-out infinite; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- Industrial Chassis Frame -->
  <rect width="920" height="340" rx="12" fill="url(#chassisGrad)" stroke="#27272a" stroke-width="1.5" />

  <!-- Corner Precision Fasteners -->
  <circle cx="16" cy="16" r="3" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
  <circle cx="904" cy="16" r="3" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
  <circle cx="16" cy="324" r="3" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
  <circle cx="904" cy="324" r="3" fill="#18181b" stroke="#3f3f46" stroke-width="1" />

  <!-- LEFT: ACOUSTIC-RADAR TRIANGULATION DISPLAY (Center: 210, 170) -->
  <g id="radar-scope">
    <!-- Scope CRT Bezel -->
    <circle cx="210" cy="170" r="140" fill="url(#crtGlow)" stroke="#1f2923" stroke-width="2" />
    <circle cx="210" cy="170" r="140" fill="url(#radarGrid)" />

    <!-- Range Rings (Calibrated in Meters) -->
    <circle cx="210" cy="170" r="130" fill="none" stroke="#23382c" stroke-width="1" />
    <circle cx="210" cy="170" r="95" fill="none" stroke="#23382c" stroke-width="0.8" stroke-dasharray="3 3" />
    <circle cx="210" cy="170" r="60" fill="none" stroke="#23382c" stroke-width="0.8" />
    <circle cx="210" cy="170" r="25" fill="none" stroke="#23382c" stroke-width="0.8" stroke-dasharray="2 2" />

    <!-- Azimuth Polar Crosshairs -->
    <line x1="70" y1="170" x2="350" y2="170" stroke="#23382c" stroke-width="0.8" />
    <line x1="210" y1="30" x2="210" y2="310" stroke="#23382c" stroke-width="0.8" />

    <!-- 45-degree Diagonal Guide Lines -->
    <line x1="118" y1="78" x2="302" y2="262" stroke="#1b2e23" stroke-width="0.6" stroke-dasharray="4 4" />
    <line x1="118" y1="262" x2="302" y2="78" stroke="#1b2e23" stroke-width="0.6" stroke-dasharray="4 4" />

    <!-- Compass Degree Markers -->
    <text x="210" y="24" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#30d158">000° N</text>
    <text x="358" y="173" class="mono" font-size="8.5" font-weight="700" fill="#71717a">090° E</text>
    <text x="210" y="322" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#71717a">180° S</text>
    <text x="62" y="173" text-anchor="end" class="mono" font-size="8.5" font-weight="700" fill="#71717a">270° W</text>

    <!-- Range Distance Labels -->
    <text x="214" y="108" class="mono" font-size="7.5" fill="#446150">1,500m</text>
    <text x="214" y="142" class="mono" font-size="7.5" fill="#446150">750m</text>

    <!-- Triangulation Bearing Vector (From Sector Station A) -->
    <line x1="90" y1="280" x2="275" y2="125" stroke="#ff9f0a" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="4 3" />
    <text x="100" y="270" class="mono" font-size="7" fill="#ff9f0a">BEARING: 042° TRUE</text>

    <!-- Continuous Sweep Beam -->
    <g class="sweep-arm">
      <!-- Sector phosphor trail -->
      <path d="M 210 170 L 210 30 A 140 140 0 0 1 330 100 Z" fill="url(#sweepGrad)" />
      <!-- Leading edge laser line -->
      <line x1="210" y1="170" x2="210" y2="30" stroke="#30d158" stroke-width="1.8" />
      <circle cx="210" cy="30" r="2" fill="#30d158" />
    </g>

    <!-- TARGET ACQUISITION BLIP (Dadar West // Apt 302: 275, 125) -->
    <g>
      <!-- Pulsing Acoustic Waves -->
      <circle class="target-ping" cx="275" cy="125" r="16" fill="none" stroke="#ff453a" stroke-width="1.5" />
      <circle class="target-ping" cx="275" cy="125" r="28" fill="none" stroke="#ff453a" stroke-width="1" />
      
      <!-- Center Blip Core -->
      <circle cx="275" cy="125" r="4.5" fill="#ff453a" />
      <circle cx="275" cy="125" r="1.5" fill="#ffffff" />

      <!-- Tactical Bracket Reticle -->
      <g class="reticle-lock" stroke="#ff453a" stroke-width="1.4" fill="none">
        <path d="M 263 115 L 263 119 M 263 115 L 267 115" />
        <path d="M 287 115 L 287 119 M 287 115 L 283 115" />
        <path d="M 263 135 L 263 131 M 263 135 L 267 135" />
        <path d="M 287 135 L 287 131 M 287 135 L 283 135" />
      </g>

      <!-- Target Annotation Box -->
      <g transform="translate(295, 110)">
        <rect width="105" height="32" rx="3" fill="#141720" stroke="#ff453a" stroke-width="0.8" />
        <text x="6" y="13" class="mono" font-size="7.5" font-weight="700" fill="#ff453a">● TARGET LOCKED</text>
        <text x="6" y="25" class="mono" font-size="7" fill="#d4d4d8">APT 302 · FL 3</text>
      </g>
    </g>
  </g>

  <!-- Center Vertical Dividing Hairline with Gauge Ticks -->
  <line x1="440" y1="24" x2="440" y2="316" stroke="#27272a" stroke-width="1" />
  <line x1="436" y1="80" x2="444" y2="80" stroke="#3f3f46" stroke-width="1" />
  <line x1="436" y1="170" x2="444" y2="170" stroke="#3f3f46" stroke-width="1" />
  <line x1="436" y1="260" x2="444" y2="260" stroke="#3f3f46" stroke-width="1" />

  <!-- RIGHT: REAL-TIME TACTICAL TELEMETRY HUD -->
  <g transform="translate(470, 28)">
    <!-- Header Strip -->
    <g>
      <text x="0" y="14" class="sans" font-size="14" font-weight="800" fill="#f4f4f5" letter-spacing="1.2">
        TACTICAL RADAR TELEMETRY
      </text>
      <text x="0" y="30" class="mono" font-size="9.5" fill="#71717a">
        ESRI LEVEL-19 GROUND RESOLVER // CASE-2026-0002
      </text>

      <!-- Right-aligned Live Heartbeat -->
      <g transform="translate(370, 6)">
        <circle cx="0" cy="5" r="3.5" fill="#30d158" />
        <text x="10" y="8" class="mono" font-size="8.5" font-weight="600" fill="#30d158">GPS SYNC: 100%</text>
      </g>
    </g>

    <!-- Top Telemetry Row: 2 Modular Metric Blocks -->
    <g transform="translate(0, 48)">
      <!-- Block 1: GPS Position -->
      <g>
        <rect width="195" height="52" rx="6" fill="#12141a" stroke="#27272a" stroke-width="1" />
        <text x="12" y="18" class="mono" font-size="8" fill="#71717a">RESOLVED COORDINATES</text>
        <text x="12" y="38" class="mono" font-size="12" font-weight="700" fill="#f4f4f5">19.0192° N, 72.8428° E</text>
      </g>

      <!-- Block 2: Structural Elevation -->
      <g transform="translate(205, 0)">
        <rect width="205" height="52" rx="6" fill="#12141a" stroke="#27272a" stroke-width="1" />
        <text x="12" y="18" class="mono" font-size="8" fill="#71717a">STRUCTURAL RESOLUTION</text>
        <text x="12" y="38" class="mono" font-size="12" font-weight="700" fill="#ff9f0a">FLOOR 3 // APARTMENT 302</text>
      </g>
    </g>

    <!-- Mid Telemetry Row: Precision & Dispatch ETA -->
    <g transform="translate(0, 110)">
      <!-- Block 3: Radius Accuracy -->
      <g>
        <rect width="195" height="52" rx="6" fill="#12141a" stroke="#27272a" stroke-width="1" />
        <text x="12" y="18" class="mono" font-size="8" fill="#71717a">RADIAL ERROR BOUND</text>
        <text x="12" y="38" class="mono" font-size="12" font-weight="700" fill="#30d158">ACCURACY: ±350 METERS</text>
      </g>

      <!-- Block 4: Dispatch Routing -->
      <g transform="translate(205, 0)">
        <rect width="205" height="52" rx="6" fill="#12141a" stroke="#27272a" stroke-width="1" />
        <text x="12" y="18" class="mono" font-size="8" fill="#71717a">INTERCEPT PROTOCOL</text>
        <text x="12" y="38" class="mono" font-size="12" font-weight="700" fill="#ff453a">ETA: 3 MINS · PATROL-04</text>
      </g>
    </g>

    <!-- Bottom Threat Card: Audio Forensics Insight -->
    <g transform="translate(0, 172)">
      <rect width="410" height="92" rx="6" fill="#0e1017" stroke="#2e3445" stroke-width="1" />
      
      <!-- Left indicator strip -->
      <rect x="0" y="0" width="4" height="92" rx="2" fill="#ff453a" />

      <g transform="translate(16, 18)">
        <text x="0" y="0" class="mono" font-size="8.5" font-weight="700" fill="#ff453a">THREAT ASSESSMENT // COVERT HOSTAGE CALL</text>
        <text x="0" y="16" class="sans" font-size="11" font-weight="600" fill="#f4f4f5">
          "Disguised Pizza Order Protocol" verified via Acoustic Tremor
        </text>
        <text x="0" y="34" class="mono" font-size="8.5" fill="#a1a1aa">
          F0 Pitch Instability: 84% · Pause Ratio: 0.72 · Hostile entity present
        </text>
        <text x="0" y="52" class="mono" font-size="8" fill="#30d158">
          ✓ AUTONOMOUS EVIDENCE DOSSIER SEALED [SHA-256: 8f4b...3c19]
        </text>
      </g>

      <!-- Mini Live Audio Visualizer inside Card -->
      <g transform="translate(365, 45)">
        <rect class="bar-1" x="0" y="0" width="3" height="24" rx="1.5" fill="#ff453a" />
        <rect class="bar-2" x="7" y="0" width="3" height="30" rx="1.5" fill="#ff9f0a" />
        <rect class="bar-3" x="14" y="0" width="3" height="18" rx="1.5" fill="#30d158" />
        <rect class="bar-1" x="21" y="0" width="3" height="28" rx="1.5" fill="#ff453a" />
      </g>
    </g>
  </g>
</svg>

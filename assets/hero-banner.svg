<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <!-- Dark Matte Obsidian Chassis -->
    <linearGradient id="chassisBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121318" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <!-- Scope Screen Gradient -->
    <linearGradient id="scopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>

    <!-- Wave Beam 1 (Signal Vermillion) -->
    <linearGradient id="waveVermillion" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.1" />
      <stop offset="20%" stop-color="#ff453a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff9f0a" stop-opacity="1" />
      <stop offset="80%" stop-color="#ff453a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0.1" />
    </linearGradient>

    <!-- Wave Beam 2 (Secondary Subharmonic) -->
    <linearGradient id="waveAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9f0a" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffd60a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff9f0a" stop-opacity="0" />
    </linearGradient>

    <!-- Precision Dot Matrix Pattern -->
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#27272a" opacity="0.6" />
    </pattern>

    <style>
      @keyframes waveScroll1 {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -720; }
      }
      @keyframes waveScroll2 {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 720; }
      }
      @keyframes ledPulse {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #ff453a); }
        50% { opacity: 0.35; filter: none; }
      }
      @keyframes phosphorSweep {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
      @keyframes organicBreathing {
        0%, 100% { transform: scaleY(0.96); opacity: 0.92; }
        50% { transform: scaleY(1.08); opacity: 1; }
      }
      .wave-primary {
        stroke-dasharray: 360 360;
        transform-origin: 414px 57.5px;
        animation: waveScroll1 7s linear infinite, organicBreathing 3.2s ease-in-out infinite;
      }
      .wave-secondary {
        stroke-dasharray: 240 240;
        transform-origin: 414px 57.5px;
        animation: waveScroll2 10s linear infinite, organicBreathing 4.5s ease-in-out infinite reverse;
      }
      .indicator-led { animation: ledPulse 1.8s ease-in-out infinite; }
      .screen-glow { animation: phosphorSweep 4s ease-in-out infinite; }

      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- Industrial Outer Chassis -->
  <rect width="900" height="300" rx="14" fill="url(#chassisBg)" stroke="#27272a" stroke-width="1.5" />

  <!-- Hardware Screws (Tactile Industrial Feel) -->
  <circle cx="16" cy="16" r="3.5" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
  <line x1="14" y1="16" x2="18" y2="16" stroke="#52525b" stroke-width="0.8" />
  <circle cx="884" cy="16" r="3.5" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
  <line x1="882" y1="16" x2="886" y2="16" stroke="#52525b" stroke-width="0.8" />
  <circle cx="16" cy="284" r="3.5" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
  <line x1="14" y1="284" x2="18" y2="284" stroke="#52525b" stroke-width="0.8" />
  <circle cx="884" cy="284" r="3.5" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
  <line x1="882" y1="284" x2="886" y2="284" stroke="#52525b" stroke-width="0.8" />

  <!-- Top Header Deck -->
  <g transform="translate(36, 32)">
    <!-- Hardware Status LED -->
    <circle class="indicator-led" cx="6" cy="6" r="4" fill="#ff453a" />
    <circle cx="6" cy="6" r="8" fill="none" stroke="#ff453a" stroke-opacity="0.3" stroke-width="1" />
    <text x="22" y="10" class="mono" font-size="10" font-weight="600" fill="#f4f4f5" letter-spacing="1.5">UNIT // DHVANI-DSP-911</text>
    <text x="240" y="10" class="mono" font-size="10" fill="#71717a">SAMPLING: <tspan fill="#d4d4d8">16,000 Hz · 16-BIT PCM</tspan></text>
    <text x="540" y="10" class="mono" font-size="10" fill="#71717a">LATENT WINDOW: <tspan fill="#d4d4d8">10.0s AST</tspan></text>
    <text x="750" y="10" class="mono" font-size="10" fill="#34c759">● ONLINE · READY</text>
  </g>

  <line x1="32" y1="50" x2="868" y2="50" stroke="#27272a" stroke-width="1" />

  <!-- Brand Typography (Swiss Modernist Layout) -->
  <g transform="translate(36, 75)">
    <text x="0" y="38" class="sans" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      DHVANI <tspan font-weight="300" fill="#ff453a">ध्वनि</tspan>
    </text>
    <text x="0" y="58" class="mono" font-size="10.5" font-weight="500" fill="#a1a1aa" letter-spacing="2">
      COVERT DISTRESS INTELLIGENCE &amp; TACTICAL GEOLOCATION SYSTEM
    </text>
  </g>

  <!-- Embedded Precision Oscilloscope Screen -->
  <g class="screen-glow" transform="translate(36, 145)">
    <!-- Screen Frame -->
    <rect width="828" height="115" rx="8" fill="url(#scopeGrad)" stroke="#27272a" stroke-width="1.2" />
    <!-- Grid Overlay -->
    <rect width="828" height="115" rx="8" fill="url(#dotGrid)" />

    <!-- Calibration Hairlines -->
    <line x1="0" y1="57.5" x2="828" y2="57.5" stroke="#1f242d" stroke-width="1" />
    <line x1="207" y1="0" x2="207" y2="115" stroke="#1f242d" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="414" y1="0" x2="414" y2="115" stroke="#1f242d" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="621" y1="0" x2="621" y2="115" stroke="#1f242d" stroke-width="0.8" stroke-dasharray="2 4" />

    <!-- Screen Scale Legend -->
    <text x="12" y="16" class="mono" font-size="8.5" fill="#52525b">+12 dBFS</text>
    <text x="12" y="60" class="mono" font-size="8.5" fill="#71717a">0 dBFS (REF)</text>
    <text x="12" y="104" class="mono" font-size="8.5" fill="#52525b">-48 dBFS</text>

    <text x="212" y="16" class="mono" font-size="8" fill="#52525b">100 Hz</text>
    <text x="419" y="16" class="mono" font-size="8" fill="#52525b">1.0 kHz</text>
    <text x="626" y="16" class="mono" font-size="8" fill="#52525b">8.0 kHz</text>
    <text x="770" y="16" class="mono" font-size="8" fill="#ff9f0a">16.0 kHz NYQ</text>

    <!-- Secondary Harmonic Waveform (Subtle Golden Sine Envelope) -->
    <path class="wave-secondary" d="
      M 0 57.5 
      Q 50 42, 100 57.5 T 200 57.5 T 300 57.5 T 400 57.5 T 500 57.5 T 600 57.5 T 700 57.5 T 828 57.5
      M 828 57.5 
      Q 778 72, 728 57.5 T 628 57.5 T 528 57.5 T 428 57.5 T 328 57.5 T 228 57.5 T 128 57.5 T 0 57.5
    " fill="none" stroke="url(#waveAmber)" stroke-width="1.6" />

    <!-- Primary Complex Harmonic Waveform (Vocal Distress Signature) -->
    <path class="wave-primary" d="
      M 0 57.5
      C 40 57.5, 60 20, 100 20
      C 130 20, 150 92, 190 92
      C 230 92, 250 35, 290 35
      C 320 35, 340 78, 380 78
      C 420 78, 440 28, 480 28
      C 510 28, 530 84, 570 84
      C 610 84, 630 38, 670 38
      C 710 38, 730 72, 770 72
      C 800 72, 815 57.5, 828 57.5
      C 840 57.5, 860 20, 900 20
      C 930 20, 950 92, 990 92
      C 1030 92, 1050 35, 1090 35
    " fill="none" stroke="url(#waveVermillion)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Live Telemetry Tag (Bottom Right inside Scope) -->
    <rect x="670" y="86" width="146" height="20" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
    <circle cx="682" cy="96" r="3" fill="#34c759" />
    <text x="692" y="99" class="mono" font-size="8.5" font-weight="600" fill="#e4e4e7">SPEECH DETECTED: 98%</text>
  </g>

  <!-- Bottom Calibrated Metadata Strip -->
  <g transform="translate(36, 282)">
    <text x="0" y="0" class="mono" font-size="8.5" fill="#52525b">ARCHITECTURE: TRANSFORMER-ASR // AUDIOSET-AST // WAV2VEC2 // ESRI-SAT</text>
    <text x="828" y="0" text-anchor="end" class="mono" font-size="8.5" fill="#71717a">AUTONOMOUS DISPATCH LATENCY: <tspan fill="#ff453a" font-weight="bold">1.4 SECONDS</tspan></text>
  </g>
</svg>
